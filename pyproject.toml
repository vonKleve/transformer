[project]
name = "transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleksandr Mykhailovskyi", email = "oleksandr.mykhailovskyi@ubisoft.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
transformer = "transformer:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
